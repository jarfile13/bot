<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--tg-theme-bg-color, #0f0f0f); color: var(--tg-theme-text-color, #fff); min-height: 100vh; padding: 20px; }
    .card { background: var(--tg-theme-secondary-bg-color, #1c1c1e); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .balance { font-size: 48px; font-weight: bold; text-align: center; margin: 16px 0; }
    .label { font-size: 14px; opacity: 0.6; text-align: center; }
    button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: var(--tg-theme-button-color, #007aff); color: #fff; }
    .btn-secondary { background: var(--tg-theme-secondary-bg-color, #2c2c2e); color: var(--tg-theme-text-color, #fff); border: 1px solid rgba(255,255,255,0.1); }
    .btn-ad { background: #34c759; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .ref-link { display: flex; gap: 8px; }
    .ref-link input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 12px; }
    .ref-link button { width: auto; padding: 12px 16px; margin: 0; }
    .status { text-align: center; font-size: 14px; opacity: 0.7; margin-top: 8px; min-height: 20px; }
    .ad-buttons { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">⭐ Твой баланс</div>
    <div class="balance" id="balance">0.00</div>
    <div class="label">Звёзд</div>
  </div>

  <div class="card">
    <div class="label" style="text-align:left; margin-bottom:12px;">📺 Заработать (+0.2 ⭐ за ссылку)</div>
    <div class="ad-buttons">
      <button class="btn-ad ad-btn" data-id="0">🔗 Открыть ссылку 1</button>
      <button class="btn-ad ad-btn" data-id="1">🔗 Открыть ссылку 2</button>
      <button class="btn-ad ad-btn" data-id="2">🔗 Открыть ссылку 3</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="label" style="text-align:left; margin-bottom:8px;">👥 Пригласи друга (+1 ⭐)</div>
    <div class="ref-link">
      <input type="text" id="ref-link" readonly>
      <button class="btn-secondary" id="copy-ref">📋</button>
    </div>
  </div>

  <div class="card">
    <button class="btn-primary" id="withdraw-btn">💸 Вывести звёзды</button>
  </div>

  <script>
    const AD_REWARD = 0.2;
    const REFERRAL_REWARD = 1;
    const COOLDOWN_MS = 5 * 60 * 1000;
    const WAIT_MS = 3000;

    const AD_LINKS = [
      'https://www.profitableratecpmnetwork.com/zvuppgu1?key=ff96d8b197f15a423003f11af7978655',
      'https://www.profitableratecpmnetwork.com/a3mg4rh3x4?key=2be145c8fc7d9d8c29b6a705806b0598',
      'https://www.profitableratecpmnetwork.com/s7p5vvdbuc?key=2d2a73f5fe9b861dee8060f1e93d44ad'
    ];

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const userId = tg?.initDataUnsafe?.user?.id || '0';
    const botUsername = 'Tonnerobot';

    let balance = parseFloat(localStorage.getItem('balance_' + userId) || '0');
    let refs = parseInt(localStorage.getItem('refs_' + userId) || '0');
    let lastRewardTime = parseInt(localStorage.getItem('lastReward_' + userId) || '0');
    let activeTimers = {};

    function updateUI() {
      document.getElementById('balance').textContent = balance.toFixed(2);
      const refLink = `https://t.me/${botUsername}?start=ref_${userId}`;
      document.getElementById('ref-link').value = refLink;

      const now = Date.now();
      const timePassed = now - lastRewardTime;
      
      document.querySelectorAll('.ad-btn').forEach(btn => {
        if (timePassed < COOLDOWN_MS) {
          const left = Math.ceil((COOLDOWN_MS - timePassed) / 1000);
          btn.textContent = `⏳ Ждать ${Math.floor(left / 60)}:${(left % 60).toString().padStart(2, '0')}`;
          btn.disabled = true;
        } else {
          const id = parseInt(btn.getAttribute('data-id'), 10);
          if (!activeTimers[id]) {
            btn.textContent = `🔗 Открыть ссылку ${id + 1}`;
            btn.disabled = false;
          }
        }
      });
    }

    function save() {
      localStorage.setItem('balance_' + userId, balance.toString());
      localStorage.setItem('refs_' + userId, refs.toString());
      localStorage.setItem('lastReward_' + userId, lastRewardTime.toString());
    }

    document.querySelectorAll('.ad-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(e.target.getAttribute('data-id'), 10);
        const status = document.getElementById('status');
        const link = AD_LINKS[id];

        if (activeTimers[id]) return;

        window.open(link, '_blank');
        e.target.disabled = true;
        e.target.textContent = '⏳ Ждите 3 сек...';
        status.textContent = 'Ссылка открыта. Вернитесь через 3 секунды.';

        activeTimers[id] = setTimeout(() => {
          delete activeTimers[id];
          e.target.textContent = '✅ Забрать +0.2 ⭐';
          e.target.disabled = false;
          
          e.target.onclick = (ev) => {
            ev.preventDefault();
            const now = Date.now();
            if (now - lastRewardTime < COOLDOWN_MS) {
              tg?.showAlert?.('Подождите, кулдаун еще не прошел!') || alert('Подождите!');
              return;
            }
            
            balance += AD_REWARD;
            lastRewardTime = now;
            save();
            status.textContent = '✅ Награда начислена!';
            
            e.target.onclick = null;
            setTimeout(() => {
              status.textContent = '';
              updateUI();
            }, 1500);
          };
        }, WAIT_MS);
      });
    });

    document.getElementById('copy-ref').addEventListener('click', () => {
      const input = document.getElementById('ref-link');
      input.select();
      input.setSelectionRange(0, 99999);
      document.execCommand('copy');
      tg?.showAlert?.('Ссылка скопирована!') || alert('Ссылка скопирована!');
    });

    document.getElementById('withdraw-btn').addEventListener('click', () => {
      if (balance < 15) {
        tg?.showAlert?.('Минимум для вывода: 15 ⭐') || alert('Минимум для вывода: 15 ⭐');
        return;
      }
      
      const amount = Math.floor(balance);
      balance -= amount;
      save();
      updateUI();
      
      const url = `https://t.me/${botUsername}?start=withdraw_${amount}`;
      tg.openTelegramLink(url);
    });

    setInterval(updateUI, 1000);
    updateUI();
  </script>
</body>
</html>
