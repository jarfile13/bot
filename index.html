<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--tg-theme-bg-color, #0f0f0f); color: var(--tg-theme-text-color, #fff); min-height: 100vh; padding: 20px; }
    .card { background: var(--tg-theme-secondary-bg-color, #1c1c1e); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .balance { font-size: 48px; font-weight: bold; text-align: center; margin: 16px 0; }
    .label { font-size: 14px; opacity: 0.6; text-align: center; }
    button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: var(--tg-theme-button-color, #007aff); color: #fff; }
    .btn-secondary { background: var(--tg-theme-secondary-bg-color, #2c2c2e); color: var(--tg-theme-text-color, #fff); border: 1px solid rgba(255,255,255,0.1); }
    .btn-ad { background: #34c759; color: #fff; }
    .ref-link { display: flex; gap: 8px; }
    .ref-link input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 12px; }
    .ref-link button { width: auto; padding: 12px 16px; margin: 0; }
    #ad-container { margin: 16px 0; min-height: 250px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; }
    #ad-container iframe { border: 0; padding: 0; width: 100%; height: auto; overflow: hidden; display: block; margin: auto; }
    .hidden { display: none; }
    .status { text-align: center; font-size: 14px; opacity: 0.7; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">⭐ Твой баланс</div>
    <div class="balance" id="balance">0.00</div>
    <div class="label">Звёзд</div>
  </div>

  <div class="card">
    <button class="btn-ad" id="watch-ad">📺 Смотреть рекламу (+0.2 ⭐)</button>
    <div id="ad-container" class="hidden"></div>
    <div class="status" id="ad-status"></div>
  </div>

  <div class="card">
    <div class="label" style="text-align:left; margin-bottom:8px;">👥 Пригласи друга (+1 ⭐)</div>
    <div class="ref-link">
      <input type="text" id="ref-link" readonly>
      <button class="btn-secondary" id="copy-ref">📋</button>
    </div>
  </div>

  <script>
    const AD_REWARD = 0.2;
    const REFERRAL_REWARD = 1;
    const AADS_BLOCK_ID = '2448856';

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const userId = tg?.initDataUnsafe?.user?.id || '0';
    const username = tg?.initDataUnsafe?.user?.username || '';
    const botUsername = 'Tonnerobot';

    let balance = parseFloat(localStorage.getItem('balance_' + userId) || '0');
    let adCount = parseInt(localStorage.getItem('adCount_' + userId) || '0');
    let refs = parseInt(localStorage.getItem('refs_' + userId) || '0');

    function updateUI() {
      document.getElementById('balance').textContent = balance.toFixed(2);
      const refLink = `https://t.me/${botUsername}?start=ref_${userId}`;
      document.getElementById('ref-link').value = refLink;
    }

    function save() {
      localStorage.setItem('balance_' + userId, balance.toString());
      localStorage.setItem('adCount_' + userId, adCount.toString());
      localStorage.setItem('refs_' + userId, refs.toString());
    }

    document.getElementById('watch-ad').addEventListener('click', () => {
      const container = document.getElementById('ad-container');
      const status = document.getElementById('ad-status');
      container.innerHTML = '';
      container.classList.remove('hidden');
      status.textContent = 'Загрузка рекламы...';

      const iframe = document.createElement('iframe');
      iframe.src = `//acceptable.a-ads.com/${AADS_BLOCK_ID}/?size=Adaptive`;
      iframe.setAttribute('data-aa', AADS_BLOCK_ID);
      iframe.style.cssText = 'border:0; padding:0; width:100%; height:250px; overflow:hidden; display:block; margin:auto;';
      iframe.onload = () => {
        status.textContent = 'Реклама показана. Награда начислена!';
        balance += AD_REWARD;
        adCount++;
        save();
        updateUI();
        setTimeout(() => {
          container.classList.add('hidden');
          status.textContent = '';
        }, 3000);
      };
      container.appendChild(iframe);
    });

    document.getElementById('copy-ref').addEventListener('click', () => {
      const input = document.getElementById('ref-link');
      input.select();
      input.setSelectionRange(0, 99999);
      document.execCommand('copy');
      tg?.showAlert?.('Ссылка скопирована!') || alert('Ссылка скопирована!');
    });

    updateUI();
  </script>
</body>
</html>
