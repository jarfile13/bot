<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (code) {
                window.location.replace('https://t.me/Tonnerobot?start=' + encodeURIComponent(code));
            } else {
                document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:50px">Invalid link. Please return to the bot.</p>';
            }
        })();
    </script>
</head>
<body>
    <p style="font-family:sans-serif;text-align:center;margin-top:50px">Redirecting to Telegram...</p>
</body>
</html>
