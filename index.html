<!DOCTYPE html>
<html>
<head>
    <title>Verifying...</title>
</head>
<body>
    <h2>Verification successful! Redirecting back to Telegram...</h2>
    <script>
        // Считываем токен, который бот передал через AdFly
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('param') || urlParams.get('click') || urlParams.get('id');
        
        // Моментально возвращаем пользователя в бота с его кодом
        if (token) {
            window.location.href = `https://t.me{token}`;
        } else {
            document.body.innerHTML = "<h3>Error: Token not found. Go back to the bot.</h3>";
        }
    </script>
</body>
</html>
